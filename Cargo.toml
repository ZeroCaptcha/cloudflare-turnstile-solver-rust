[package]
name = "cloudflare-turnstile-solver"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Solve Cloudflare Turnstile in Rust with the ZeroCaptcha API."
license = "MIT"
publish = false

[dependencies]
serde_json = "1"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }

# Its own workspace, not a member of any repository it sits in.
[workspace]
